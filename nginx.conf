upstream flugbuech_api {
    server api:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    http2 on;

    # HTTPS is terminated by DSM's reverse proxy, which forwards over HTTP and
    # sets X-Forwarded-Proto. Redirect requests that arrived via external HTTP to
    # HTTPS. Direct LAN/VPN access (no such header) is left untouched.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Character set
    charset utf-8;

    # Max upload size
    client_max_body_size 8M;

    # Proxy API endpoints
    location /api/v1 {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://flugbuech_api;
    }

    # Static resources: Cache, no fallback
    location ~* \.(?:png|jpg|jpeg|gif|ico|ttf|woff2)$ {
        expires 30d;
        alias /flugbuech/static/;
        try_files $uri =404;
    }

    # Scripts and stylesheets: No cache, no fallback
    location ~* \.(?:js|css)$ {
        alias /flugbuech/static/;
        try_files $uri =404;
    }

    # Server static application: Fallback to fallback.html
    location / {
        alias /flugbuech/static/;
        try_files $uri /fallback.html;
    }
}
